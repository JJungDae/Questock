name: quality-gate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Verify Python runtime
        run: uv run --no-sync python -c "import sys; assert sys.version_info[:2] == (3, 11)"

      - name: Ruff
        run: uv run --no-sync ruff check --select E4,E7,E9,F app tests scripts streamlit_app.py

      - name: FSC release contracts
        run: >-
          uv run --no-sync pytest
          tests/unit/test_llm_config.py
          tests/unit/test_litellm_client.py
          tests/unit/test_request_protection.py
          tests/unit/test_session_store.py
          tests/unit/test_response_cache.py
          tests/unit/test_service_snapshot.py
          tests/unit/test_service_acceptance.py
          tests/unit/test_service_acceptance_live_runner.py
          tests/unit/test_b9_release_assets.py
          tests/unit/test_fsc_sc07_release_contract.py
          tests/integration/test_streamlit_app.py
          -q

      - name: Full pytest
        run: uv run --no-sync pytest tests -q

      - name: M3 Gate
        run: uv run --no-sync python scripts/m3_gate.py

      - name: Secret scan
        run: uv run --no-sync python scripts/secret_scan.py

      - name: Compile
        run: uv run --no-sync python -m compileall app tests scripts -q

      - name: Build release image
        run: docker build --pull --tag questock:ci .
