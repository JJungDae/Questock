name: deploy-recorded-gce

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: questock-recorded-gce
  cancel-in-progress: false

jobs:
  deploy-recorded:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release input
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure SSH
        env:
          GCE_HOST: ${{ secrets.GCE_HOST }}
          GCE_SSH_KEY: ${{ secrets.GCE_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GCE_SSH_KEY" > "$HOME/.ssh/questock_key"
          chmod 600 "$HOME/.ssh/questock_key"
          ssh-keyscan -H "$GCE_HOST" > "$HOME/.ssh/known_hosts"

      - name: Deploy and verify exact recorded release
        env:
          GCE_HOST: ${{ secrets.GCE_HOST }}
          GCE_USER: ${{ secrets.GCE_USER }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          previous_sha="$(
            ssh -i "$HOME/.ssh/questock_key" \
              "$GCE_USER@$GCE_HOST" \
              "bash -s -- '$RELEASE_SHA'" <<'PREFLIGHT'
          set -euo pipefail
          release_sha="$1"
          cd "$HOME/Questock"

          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain)"
          git fetch origin main
          git cat-file -e "$release_sha^{commit}"
          git merge-base --is-ancestor "$release_sha" origin/main
          git rev-parse HEAD
          PREFLIGHT
          )"
          [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
          previous_image_id="$(
            ssh -i "$HOME/.ssh/questock_key" \
              "$GCE_USER@$GCE_HOST" \
              "bash -s -- '$previous_sha'" <<'IMAGE_ID'
          set -euo pipefail
          previous_sha="$1"
          if image_id="$(
            docker image inspect "questock:$previous_sha" \
              --format '{{.Id}}' 2>/dev/null
          )"; then
            printf '%s\n' "$image_id"
          else
            printf 'NONE\n'
          fi
          IMAGE_ID
          )"
          if [ "$previous_image_id" != "NONE" ]; then
            [[ "$previous_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi

          rollback_release() {
            ssh -i "$HOME/.ssh/questock_key" \
              "$GCE_USER@$GCE_HOST" \
              "bash -s -- '$previous_sha' '$previous_image_id'" <<'ROLLBACK'
          set -euo pipefail
          previous_sha="$1"
          previous_image_id="$2"
          repo_dir="$HOME/Questock"
          cd "$repo_dir"

          if [ "$previous_image_id" != "NONE" ] \
            && docker image inspect "$previous_image_id" >/dev/null 2>&1; then
            docker image tag "$previous_image_id" "questock:$previous_sha"
            git switch --detach "$previous_sha"
            export QUESTOCK_IMAGE_TAG="$previous_sha"
            export QUESTOCK_SOURCE_MODE=recorded
            docker compose up -d --wait
            curl --fail --show-error --max-time 10 \
              http://127.0.0.1:8000/health
            curl --fail --show-error --max-time 10 \
              http://127.0.0.1:8501/_stcore/health
            printf 'rollback_release_sha=%s\n' "$previous_sha"
          else
            docker compose rm --stop --force
            printf 'rollback_release_sha=NONE\n'
          fi
          ROLLBACK
          }

          deployment_failed=0
          if ! ssh -i "$HOME/.ssh/questock_key" \
              "$GCE_USER@$GCE_HOST" \
              "bash -s -- '$RELEASE_SHA' '$previous_sha' \
                '$previous_image_id'" <<'REMOTE'
          set -euo pipefail
          release_sha="$1"
          previous_sha="$2"
          previous_image_id="$3"
          repo_dir="$HOME/Questock"
          cd "$repo_dir"

          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]

          git switch --detach "$release_sha"
          export QUESTOCK_IMAGE_TAG="$release_sha"
          export QUESTOCK_SOURCE_MODE=recorded
          docker compose build --pull --no-cache
          image_id="$(docker image inspect "questock:$release_sha" --format '{{.Id}}')"

          docker compose up -d --wait
          docker compose ps
          curl --fail --show-error --max-time 10 \
            http://127.0.0.1:8000/health
          curl --fail --show-error --max-time 10 \
            http://127.0.0.1:8501/_stcore/health
          docker compose exec -T api python - \
            --api-url http://127.0.0.1:8000/api/chat \
            < scripts/release_smoke.py
          printf 'release_sha=%s\n' "$release_sha"
          printf 'image_id=%s\n' "$image_id"
          printf 'previous_release_sha=%s\n' "$previous_sha"
          printf 'previous_image_id=%s\n' "$previous_image_id"
          REMOTE
          then
            deployment_failed=1
          fi

          if [ "$deployment_failed" -eq 0 ]; then
            if ! curl --fail --show-error --max-time 10 \
              "http://$GCE_HOST:8501/_stcore/health"
            then
              deployment_failed=1
            fi
          fi

          if [ "$deployment_failed" -ne 0 ]; then
            if ! rollback_release; then
              printf 'rollback_result=failed\n' >&2
            fi
            exit 1
          fi
