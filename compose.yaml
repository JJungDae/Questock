name: questock

x-questock-image: &questock-image
  image: questock:${QUESTOCK_IMAGE_TAG:-b9-local}
  build:
    context: .
    dockerfile: Dockerfile

x-questock-runtime: &questock-runtime
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: [*questock-image, *questock-runtime]
    env_file:
      - path: .env.runtime
        required: false
    command:
      - uvicorn
      - app.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      QUESTOCK_SOURCE_MODE: ${QUESTOCK_SOURCE_MODE:-recorded}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).read()
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  ui:
    <<: [*questock-image, *questock-runtime]
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      QUESTOCK_API_URL: http://api:8000/api/chat
      QUESTOCK_SOURCE_MODE: ${QUESTOCK_SOURCE_MODE:-recorded}
      QUESTOCK_UI_TIMEOUT_SECONDS: "21"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=3).read()
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
